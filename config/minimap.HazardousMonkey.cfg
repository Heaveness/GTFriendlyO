## Holding ZoomKey prevents weapon switching while scrolling. 
# Setting type: Boolean
# Default value: true
SuppressInventoryOnZoom = true

## Because we're keeping regular map logic running for the minimap even while the fullscreen map is closed, for other players, this can sometimes appear as though you're constantly movng your mouse around on the map. This is an attempt to prevent that.
# Setting type: Boolean
# Default value: true
SuppressUnintendedMinimapCursorUpdates = true

## Color of the minimap background while ZoomKey is held (hex #rrggbb)
# Setting type: String
# Default value: #ff9933
MapBackgroundZoomColor = #1f1f1f

## Thickness of player-to-player lines on the minimap in world units (0 = off)
# Setting type: Int32
# Default value: 5
PlayerLineThickness = 5

## Scale multiplier applied to player icons on the minimap 1.0 = game default, 2.0 = double size, etc
# Setting type: Single
# Default value: 2
PlayerIconScale = 2

## Scale multiplier applied to map object icons (doors, lockers, terminals, ladders, etc.) on the minimap. CM_MapSign items are excluded as they lack a centered origin. 1.0 = game default, 2.0 = double size, etc
# Setting type: Single
# Default value: 2
MinimapObjectIconScale = 2

## Frames between minimap data ticks. 0 = every frame (smoothest) Higher values reduce CPU cost but obviously will look worse
# Setting type: Int32
# Default value: 0
UpdateRate = 0

## Auto-disable when the rest of the player-hud is disabled. Works with EEC-H EMP mechanics. (This is a dropdown because I might build in more choice in the future)
# Setting type: minimapHudRespect
# Default value: No
# Acceptable values: No, Yes
Respect HUD Disabled Status = Yes

[- Shape and Position]

## Minimap shape.
# Setting type: String
# Default value: Square
# Acceptable values: Square, Circle
Shape = Circle

## Size of the minimap panel as a fraction of screen size (0.1 - 1.0)
# Setting type: Single
# Default value: 0.3
Scale = 0.25

## Overall opacity of the minimap overlay (0.0 = fully transparent, 1.0 = fully opaque).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Opacity = 0.6

## Horizontal screen edge to anchor the minimap to.
# Setting type: String
# Default value: Right
# Acceptable values: Left, Right
AnchorX = Right

## Vertical screen edge to anchor the minimap to.
# Setting type: String
# Default value: Bottom
# Acceptable values: Top, Bottom
AnchorY = Top

## Distance in pixels inward from the chosen horizontal edge.
# Setting type: Single
# Default value: 16
OffsetX = 16

## Distance in pixels inward from the chosen vertical edge.
# Setting type: Single
# Default value: 16
OffsetY = 320

[Compass]

## Show N/S/E/W compass labels around the minimap edge. Most useful when MapMatchPlayerRotation is enabled.
# Setting type: Boolean
# Default value: true
Show Compass (Requires ► Match Player Rotation) = false

## Font size for the compass direction labels.
# Setting type: Int32
# Default value: 22
FontSize = 22

## Color of the North (N) compass label (hex #rrggbb) (Green = default).
# Setting type: String
# Default value: #1ae08c
NorthColor = #ffffff

## Color of the South (S) compass label (hex #rrggbb) (Red = default).
# Setting type: String
# Default value: #ff0000
SouthColor = #ffffff

## Color of the East (E) compass label (hex #rrggbb) (Blue = default).
# Setting type: String
# Default value: #3ca3ff
EastColor = #ffffff

## Color of the West (W) compass label (hex #rrggbb) (Yellow = default).
# Setting type: String
# Default value: #ffe600
WestColor = #ffffff

[Debugging]

Enaling Debugging = true

[Zone label]

## Reveal what Zone & Area you're in above the minimap. Updated every 0.25 seconds
# Setting type: Boolean
# Default value: true
ShowLocationLabel = false

## Position of the zone label relative to the minimap edge. Top = floats above, Bottom = floats below.
# Setting type: String
# Default value: Top
# Acceptable values: Top, Bottom
Label Position (might require Offset adjustment) = Top

## Font size of the Zone|Area label displayed near the minimap
# Setting type: Int32
# Default value: 24
LocationLabelFontSize = 24

## Font name for the Zone|Area label. Must be a Unity built-in resource name (e.g. "Arial"). Falls back to Arial if the name is not found.
# Setting type: String
# Default value: Arial
Font = Arial

## Color of the text outline stroke (hex #rrggbb). Applied once at first level load — requires a game restart to change.
# Setting type: String
# Default value: #000000
OutlineColor = #000000

## Pixel radius of the text outline stroke. Applied once at first level load — requires a game restart to change.
# Setting type: Single
# Default value: 2
OutlineThickness = 2

## Zone label changes color to reflect the current drama state (Undetected, Scout wave, Door Alarm, etc). There's a 2 second delay in color changes to avoid balance concerns
# Setting type: Boolean
# Default value: true
DetectCombatState (2 second delay) = true

## Level not yet started, obviously (hex #rrggbb)
# Setting type: String
# Default value: #ffffff
ElevatorIdle = #ffffff

## Level not yet started, obviously (hex #rrggbb)
# Setting type: String
# Default value: #ffffff
ElevatorGoingDown = #ffffff

## Label color while undetected (hex #rrggbb)
# Setting type: String
# Default value: #1ae08c
Undetected = #1ae08c

## Label color while generally detected (hex #rrggbb)
# Setting type: String
# Default value: #ffa600
Encounter = #ffa600

## Label color while fighting several sleepers (hex #rrggbb)
# Setting type: String
# Default value: #ffff00
Combat = #ffff00

## Label color during Scout & Reactor waves (hex #rrggbb)
# Setting type: String
# Default value: #00ffff
Survival = #00ffff

## Label color during Door Alert wave (hex #rrggbb)
# Setting type: String
# Default value: #ff0000
IntentionalCombat = #ff0000

