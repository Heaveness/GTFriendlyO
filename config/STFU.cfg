[General Settings]

## If enabled, don't allow any logs from MCP3. Otherwise, only print unique logs.
# Setting type: Boolean
# Default value: false
Suppress All MyCoolPlugin3 Logs = false

## If enabled, don't allow any logs of EnemyType Heats and selected EnemyTypes from CGWS.
# Setting type: Boolean
# Default value: true
Suppress ConfigurableGlobalWaveSettings Logs = true

## Show the total amount of "borken cells" error logs.
# Setting type: Boolean
# Default value: true
Show Post-LG GeomorphVolume Results = true

## Show the total amount of BoxColliders warning logs with a negative size or scale.
# Setting type: Boolean
# Default value: true
Show Post-LG BoxCollider Results = true

## List the specific BoxColliders that have a negative size or scale.
# Setting type: Boolean
# Default value: false
Show Affected BoxCollider Names = false

