## Settings file was created by plugin Weapon Stat Shower v2.0.2
## Plugin GUID: WeaponStatShower

[ShowStat]

## Select the mod language.
# Setting type: LanguageEnum
# Default value: English
# Acceptable values: English, Chinese
Language = English

## Select which Sleepers are shown, seperated by a comma.
## Acceptable values: ALL, NONE, STRIKER, SHOOTER, SCOUT, BIG_STRIKER, BIG_SHOOTER, CHARGER, CHARGER_SCOUT
# Setting type: String
# Default value: NONE
SleepersShown = NONE

## Add a description tab with auto-generated weapon stats.
## Force will always create a tab, even if the rundown developer disables it.
# Setting type: ShowStatSetting
# Default value: True
# Acceptable values: False, True, Force
ShowStats = True

## Which tab to place the auto-generated weapon stats.
## Combined will combine it with the normal description, similar to older versions.
# Setting type: StatsPosition
# Default value: Last
# Acceptable values: Last, First, Combined
StatsPosition = First

## Keeps the current page number active when selecting different gear (if it exists).
# Setting type: Boolean
# Default value: true
PreservePage = true

